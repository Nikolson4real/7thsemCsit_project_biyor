services:
  biyor-backend: # Renamed service to lowercase to be safe
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biyor-ai-backend # Changed to lowercase
    # Explicitly define image name in lowercase to avoid ambiguity based on folder name
    image: biyor-ai-backend-image 
    ports:
      - "8000:8000"
    environment:
      # Google AI Studio Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      
      # Gemini Model Configuration
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-gemini-2.5-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.0-flash-exp}
      - GOOGLE_EMBEDDINGS_MODEL=${GOOGLE_EMBEDDINGS_MODEL:-models/text-embedding-004}
      
      # FAISS and Document Configuration
      - FAISS_INDEX_PATH=${FAISS_INDEX_PATH:-./data/faiss_index}
      - RULEBOOKS_DIR=${RULEBOOKS_DIR:-./data/rulebooks}
      
      # RAG Pipeline Configuration
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-600}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
      
      # LLM Configuration
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-2048}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      
      # API Configuration
      - API_VERSION=${API_VERSION:-v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    volumes:
      - ./data/rulebooks:/app/data/rulebooks:ro
      - faiss_data:/app/data/faiss_index
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      # Using wget or curl is often more reliable if installed, otherwise python is fine.
      # Ensure the URL matches the port exposed inside the container (8000).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - biyor-network # Renamed network to lowercase

volumes:
  faiss_data:
    driver: local

networks:
  biyor-network:
    driver: bridge